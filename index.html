<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>잿불 금고 · 게임 시작</title>
  <meta name="theme-color" content="#131c1c">
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101b24;color:#ead5aa;font-family:system-ui,sans-serif;text-align:center}main{padding:24px}a{display:inline-block;padding:16px 24px;border:1px solid #bf9a57;color:inherit;font-weight:bold;text-decoration:none}p{line-height:1.6}</style>
</head>
<body>
  <main><h1>잿불 금고</h1><p>게임 화면으로 이동합니다.</p><a id="play" href="./dist/">게임 시작</a></main>
  <script>
    const game = new URL('./dist/', location.href);
    game.search = location.search;
    game.hash = location.hash;
    document.querySelector('#play').href = game.href;
    location.replace(game.href);
  </script>
</body>
</html>
