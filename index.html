<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#131c1c">
  <meta name="description" content="욕심은 소리를 낸다. 능력을 추출해 길을 열고, 용이 잠든 도트 던전에서 유물을 훔쳐 탈출하세요. 잿불 금고 — 싱글플레이 덱빌딩 던전 크롤러.">
  <title>잿불 금고 · EMBER VAULT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131c1c'/%3E%3Cpath d='M8 8h16l5 8-13 14L3 16Z' fill='%23e4b66e'/%3E%3Cpath d='m16 3 4 13-4 14-4-14Z' fill='%23f9dc9c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./landscape.css">
  <link rel="stylesheet" href="./pool-reveal.css">
  <link rel="stylesheet" href="./viewport.css">
  <link rel="stylesheet" href="./vault-v5.css">
  <link rel="stylesheet" href="./encounter.css">
  <link rel="stylesheet" href="./play-surface.css">
  <link rel="stylesheet" href="./dragon-bag.css">
</head>
<body>
  <div class="app-shell">
    <header class="landscape-hud" aria-label="탐험 상태">
      <div id="landscapeStatus"></div>
      <div class="landscape-tools"><button data-act="menu" aria-label="탐험 메뉴">☰</button></div>
    </header>
    <main class="play-surface" aria-label="던전 탐험">
      <section class="dungeon-panel" aria-label="던전 플레이 화면">
        <div class="canvas-wrap">
          <canvas id="dungeon" width="960" height="540" aria-label="움직이는 도트 던전"></canvas>
          <div id="sceneExits" class="scene-exits" role="group" aria-label="다음 방을 눌러 이동"></div>
          <div id="travelHint" class="travel-hint" aria-live="polite" hidden></div>
          <div id="enemyOverlay" class="enemy-overlay"></div>
          <button id="sceneTarget" class="scene-target" data-act="sceneInteract" hidden></button>
        </div>
      </section>
      <section class="combat-bar" aria-label="이번 턴 남은 자원"><div id="resources" class="resources"></div></section>
      <button id="mapToggle" class="hud-minimap" data-act="zoom" aria-label="소리 지도 펼치기" aria-expanded="false" aria-controls="soundPanel">
        <canvas id="minimap" width="360" height="244" aria-hidden="true"></canvas>
        <span class="mini-caption"><span id="mapToggleLabel">소리 지도</span><span id="mapToggleIcon" aria-hidden="true">⛶</span></span>
      </button>
      <section id="soundPanel" class="map-report" aria-label="소리와 적의 반응" hidden>
        <div class="map-report-title">소리의 흔적</div>
        <p class="map-legend"><span>◆ 현재 위치</span><span>주황 · 소리</span><span>빨강 · 적</span></p>
        <div id="dangerPanel"></div>
      </section>
      <div id="mapInstructions" class="map-instructions" hidden>연결된 금빛 방을 누르면 이동합니다.</div>
      <div class="play-dock">
        <section class="pool-panel" aria-label="이번에 뽑은 능력">
          <button id="poolDetails" class="pool-details" data-act="deck" data-pile="played" aria-label="이번 추출 자세히 보기">
            <span class="pool-heading"><strong>이번 추출 <span id="handCount">5</span></strong><span id="poolStatus" class="pool-ready"></span></span>
            <span id="hand" class="token-strip"></span>
          </button>
          <div id="handPager" hidden></div>
        </section>
        <div class="field-tools" role="group" aria-label="탐험 행동">
          <button id="stanceToggle" data-act="stance" aria-expanded="false" aria-controls="stanceMenu"><strong id="stanceLabel">걷기</strong><small>이동 방식 ▴</small></button>
          <button id="lureToggle" data-act="lureMode" aria-pressed="false"><strong>유인</strong><small>기술 1</small></button>
          <button id="hideAction" data-act="hide"><strong>숨죽이기</strong><small>이동 1</small></button>
          <button id="marketToggle" data-act="market"><strong>교역</strong><small>능력 영입</small></button>
        </div>
        <div class="draw-control"><span id="turnRisk"></span><button id="endTurn" class="end-button" data-act="end"><span>풀 뽑기</span><small>턴 종료</small><b aria-hidden="true">✧</b></button></div>
      </div>
      <div id="stanceMenu" class="stance-menu" role="group" aria-label="이동 방식 선택" hidden></div>
    </main>
  </div>
  <aside id="tutorialCoach" class="tutorial-coach" aria-live="polite" hidden></aside>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="noiseMoment" class="noise-moment" aria-labelledby="noiseTitle"></dialog>
  <dialog id="modal" aria-labelledby="modalTitle"><div id="modalContent"></div></dialog>
  <dialog id="poolReveal" class="pool-reveal" aria-labelledby="revealTitle" aria-describedby="revealStakes"><div class="reveal-content"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
