<!doctype html><html lang="ko"><meta charset="utf-8"><title>Ember Vault · viewport review</title><style>body{margin:0;background:#10151d;color:#e5d4b2;font:14px system-ui}nav{padding:12px;display:flex;gap:8px}button{border:1px solid #8a7046;background:#192533;color:#e5d4b2;padding:8px 15px}iframe{display:block;border:0;margin:10px auto;background:#040b14}#result{white-space:pre-wrap;font:11px monospace;margin:15px}</style><nav><button data-size="844,390">844 × 390</button><button data-size="740,320">740 × 320</button><button data-size="932,430">932 × 430</button><button data-size="390,844">390 × 844</button><button data-size="1280,720">1280 × 720</button><button id="inspect">레이아웃 검사</button></nav><iframe title="게임 미리보기" src="../../dist/index.html" width="844" height="390"></iframe><pre id="result"></pre><pre id="phases"></pre><script>const frame=document.querySelector('iframe');frame.addEventListener('load',()=>{const d=frame.contentDocument,seen=[];new MutationObserver(()=>{const el=d.querySelector('#poolReveal'),phase=el?.dataset.phase;if(phase&&seen.at(-1)?.phase!==phase){seen.push({phase,title:d.querySelector('#revealTitle')?.textContent,totals:[...d.querySelectorAll('[data-total] strong')].map(e=>e.textContent),open:el.open});document.querySelector('#phases').textContent=JSON.stringify(seen);}}).observe(d.body,{subtree:true,attributes:true,childList:true});});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;});document.querySelector('#inspect').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow;const invisible=e=>!e.getClientRects().length||w.getComputedStyle(e).visibility==='hidden';const overflow=[...d.querySelectorAll('button,section,canvas,.resources,.token-strip')].filter(e=>!invisible(e)).map(e=>({tag:e.tagName,id:e.id,cls:e.className,r:e.getBoundingClientRect(),sw:e.scrollWidth,cw:e.clientWidth,sh:e.scrollHeight,ch:e.clientHeight})).filter(x=>x.r.left<-.5||x.r.top<-.5||x.r.right>w.innerWidth+.5||x.r.bottom>w.innerHeight+.5||x.sw>x.cw+2||x.sh>x.ch+2).map(x=>({id:x.id||x.cls,rect:[x.r.x,x.r.y,x.r.width,x.r.height],content:[x.sw,x.cw,x.sh,x.ch]}));document.querySelector('#result').textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],page:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],overflow},null,2);};</script></html>
